name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 1.0.0. The release and its new tag are named marlin-calc-<version>.'
        required: true

permissions:
  contents: read

env:
  TAG: marlin-calc-${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^marlin-calc-[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Versions may only contain letters, digits, dots, hyphens and underscores."
            exit 1
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
                       --jq ".[].ref | select(. == \"refs/tags/$TAG\")")
          if [ -n "$existing" ]; then
            echo "::error::$TAG already exists."
            exit 1
          fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: marlin-calc.*
          path: dist
          merge-multiple: true
      - name: Package
        working-directory: dist
        run: |
          # The binaries OctoPrint-PrintTimeGenius chooses between.
          for target in x86_64 i686 aarch64 armv7l armv6l mips amd64 \
                        darwin-x86_64 darwin-arm64 windows-AMD64.exe windows-x86.exe; do
            test -f "marlin-calc.$target" || { echo "Missing marlin-calc.$target"; exit 1; }
          done
          chmod +x marlin-calc.*
          tar -czf marlin-calc.tar.gz marlin-calc.*
          sha256sum marlin-calc.* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            marlin-calc for OctoPrint-PrintTimeGenius, built from ${{ github.sha }}.

            `marlin-calc.tar.gz` contains every binary with its executable bit set, ready to extract into `octoprint_PrintTimeGenius/analyzers/`.
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
