name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the last version to increase: patch for fixes, minor for new features, major for changes OctoPrint-PrintTimeGenius must adapt to. The first release is 1.0.0.'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# One at a time, since each release takes its number from the ones before it.
concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Choose the version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/marlin-calc-" --jq '.[].ref')
          latest=$(sed -nE 's#^refs/tags/marlin-calc-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$#\1#p' <<< "$refs" |
                   sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            version=1.0.0
          else
            released=$(gh api "repos/$GITHUB_REPOSITORY/commits/marlin-calc-$latest" --jq .sha)
            if [ "$released" = "$GITHUB_SHA" ]; then
              echo "::error::This commit is already released as marlin-calc-$latest."
              exit 1
            fi
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              *) echo "::error::bump must be patch, minor or major."; exit 1 ;;
            esac
          fi
          echo "Last release: ${latest:-none}. Releasing marlin-calc-$version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: marlin-calc-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: marlin-calc.*
          path: dist
          merge-multiple: true
      - name: Package
        working-directory: dist
        run: |
          # The binaries OctoPrint-PrintTimeGenius chooses between.
          for target in x86_64 i686 aarch64 armv7l armv6l mips amd64 \
                        darwin-x86_64 darwin-arm64 windows-AMD64.exe windows-x86.exe; do
            test -f "marlin-calc.$target" || { echo "Missing marlin-calc.$target"; exit 1; }
          done
          chmod +x marlin-calc.*
          tar -czf marlin-calc.tar.gz marlin-calc.*
          sha256sum marlin-calc.* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            marlin-calc for OctoPrint-PrintTimeGenius, built from ${{ github.sha }}.

            `marlin-calc.tar.gz` contains every binary with its executable bit set, ready to extract into `octoprint_PrintTimeGenius/analyzers/`.
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
