name: CI

on:
  pull_request:
  push:
    branches:
      - estimate-bugfix-2.0.x
      - estimate-bugfix-2.1.x
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
          - target: i686
            packages: g++-multilib
          - target: aarch64
            packages: g++-aarch64-linux-gnu qemu-user-static
          - target: armv7l
            packages: g++-arm-linux-gnueabi qemu-user-static
          - target: armv6l
            packages: g++-arm-linux-gnueabi qemu-user-static
          - target: mips
            packages: g++-mipsel-linux-gnu qemu-user-static
          # Windows binaries are tested on Windows by test-windows.
          - target: windows-AMD64
            packages: g++-mingw-w64-x86-64
          - target: windows-x86
            packages: g++-mingw-w64-i686
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install toolchain
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - run: pip install pytest
      - name: Build and test
        working-directory: calc
        run: cmake --workflow --preset ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: marlin-calc.${{ matrix.target }}
          path: calc/build/${{ matrix.target }}/marlin-calc.${{ matrix.target }}*
          if-no-files-found: error

  # One runner builds both macOS binaries because GitHub's macOS runners are
  # often short on capacity. The x86_64 binary is tested under Rosetta.
  macos:
    name: darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pytest
      - name: Build and test darwin-arm64
        working-directory: calc
        run: cmake --workflow --preset darwin-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: marlin-calc.darwin-arm64
          path: calc/build/darwin-arm64/marlin-calc.darwin-arm64
          if-no-files-found: error
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build and test darwin-x86_64
        working-directory: calc
        run: cmake --workflow --preset darwin-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: marlin-calc.darwin-x86_64
          path: calc/build/darwin-x86_64/marlin-calc.darwin-x86_64
          if-no-files-found: error

  freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14'
          prepare: |
            pkg install -y cmake-core python3
            pkg install -y "py$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')-pytest"
          run: cd calc && cmake --workflow --preset freebsd-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: marlin-calc.freebsd-amd64
          path: calc/build/freebsd-amd64/marlin-calc.amd64
          if-no-files-found: error

  test-windows:
    name: test ${{ matrix.target }}
    needs: linux
    # Still test whichever Windows binaries built if another target failed.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-AMD64, windows-x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pytest
      - uses: actions/download-artifact@v8
        with:
          name: marlin-calc.${{ matrix.target }}
          path: bin
      - run: pytest calc/tests --marlin-calc bin/marlin-calc.${{ matrix.target }}.exe
