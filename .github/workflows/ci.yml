name: CI

on:
  pull_request:
  push:
    branches:
      - estimate-bugfix-2.0.x
      - estimate-bugfix-2.1.x
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: ubuntu-24.04
          - target: i686
            os: ubuntu-24.04
            packages: g++-multilib
          - target: aarch64
            os: ubuntu-24.04
            packages: g++-aarch64-linux-gnu qemu-user-static
            emulator: qemu-aarch64-static
          - target: armv7l
            os: ubuntu-24.04
            packages: g++-arm-linux-gnueabi qemu-user-static
            emulator: qemu-arm-static
          - target: armv6l
            os: ubuntu-24.04
            packages: g++-arm-linux-gnueabi qemu-user-static
            emulator: qemu-arm-static
          - target: mips
            os: ubuntu-24.04
            packages: g++-mipsel-linux-gnu qemu-user-static
            emulator: qemu-mipsel-static
          # Windows binaries are tested on Windows by test-windows.
          - target: windows-AMD64.exe
            os: ubuntu-24.04
            packages: g++-mingw-w64-x86-64
          - target: windows-x86.exe
            os: ubuntu-24.04
            packages: g++-mingw-w64-i686
          - target: darwin-arm64
            os: macos-latest
          # Built on Apple Silicon and tested under Rosetta.
          - target: darwin-x86_64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install toolchain
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Install Rosetta
        if: matrix.target == 'darwin-x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: pip install scons pytest
      - name: Build
        run: scons -C Marlin -j4 ${{ matrix.target }}
      - name: Test
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: pytest calc_tests --marlin-calc Marlin/out/${{ matrix.target }}/marlin-calc.${{ matrix.target }}
        env:
          MARLIN_CALC_EMULATOR: ${{ matrix.emulator }}
      - uses: actions/upload-artifact@v7
        with:
          name: marlin-calc.${{ matrix.target }}
          path: Marlin/out/${{ matrix.target }}/marlin-calc.${{ matrix.target }}
          if-no-files-found: error

  test-windows:
    name: test ${{ matrix.target }}
    needs: build
    # Still test whichever Windows binaries built if another target failed.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-AMD64.exe, windows-x86.exe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pytest
      - uses: actions/download-artifact@v8
        with:
          name: marlin-calc.${{ matrix.target }}
          path: bin
      - run: pytest calc_tests --marlin-calc bin/marlin-calc.${{ matrix.target }}
